standard       = "2.1"
project        = "docxaio-hfs"
space          = "BlueSkyXN/DocxAIO-HFS"
project_class  = "preview"
target_role    = "primary"
sovereignty    = "sovereign"
lane           = "source"
version_source = "commit"
env_file       = ".env"
secret_files   = []

# These credentials are local control-plane values only; they are never Space settings.
local_only = ["HF_TOKEN", "GH_TOKEN"]

# No application secret is required by the current service.
secrets = []

# Public runtime configuration exposed by the existing application contract.
variables = [
  "PORT",
  "TEMP_DIR",
  "MAX_FILE_SIZE_MB",
  "REQUEST_TIMEOUT_SECONDS",
  "MAX_CONCURRENT_TASKS",
  "WORKERS",
  "PROCESS_LOCK_FILE",
]
